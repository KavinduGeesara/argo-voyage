apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-app
  labels:
    app: hello-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-app
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
